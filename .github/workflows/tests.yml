name: Backend tests and Firestore rules
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node --test *.test.js
      - run: npm install --no-save firebase-tools@14.22.0 @firebase/rules-unit-testing@5.0.0 firebase@12.6.0
      - run: npx firebase emulators:exec --only firestore --project demo-kutuphane "node --test firestore.rules.test.js"
